<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1582" width="900" height="1582" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">A storage node restarted under writes</title>
<desc id="d">Sequence: a storage node being stopped for an upgrade sends every core peer a signed departure notice bound to its current boot and refuses new writes as retryable. The leader counts its site down for new work at once, places the open writes on the other sites and commits them on two sites. When the upgraded store starts, it registers under its new boot, is counted up once its description verifies, and repair restores the third copy.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#051019"/><stop offset="0.55" stop-color="#0a1f2e"/><stop offset="1" stop-color="#071824"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6fb9c6" fill-opacity="0.10"/></pattern>
  <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f3a44"/><stop offset="1" stop-color="#0a2530"/></linearGradient>
  <marker id="ah-ctl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#5eead4"/></marker>
  <marker id="ah-data" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#38bdf8"/></marker>
  <marker id="ah-sig" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#fbbf24"/></marker>
  <marker id="ah-drop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#f472b6"/></marker>
  <marker id="ah-refuse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#f472b6"/></marker>
  <marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#4ade80"/></marker>
</defs>
<rect width="900" height="1582" rx="22" fill="url(#bg)"/>
<rect width="900" height="1582" rx="22" fill="url(#dots)"/>
<text x="40.0" y="58.0" font-size="26" fill="#e8f4f6" font-weight="700" text-anchor="start">A storage node restarted under writes</text>
<text x="40.0" y="88.0" font-size="15.5" fill="#93b6c1" font-weight="400" text-anchor="start">A rolling upgrade: the store says it is leaving, the core places writes elsewhere, repair catches up.</text>
<rect x="113.0" y="120" width="175.5" height="72" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.55"/>
<rect x="127.0" y="120" width="147.5" height="3" rx="1.5" fill="#a78bfa"/>
<text x="200.8" y="151.0" font-size="16" fill="#e8f4f6" font-weight="700" text-anchor="middle">Writer</text>
<text x="200.8" y="174.0" font-size="13" fill="#93b6c1" font-weight="400" text-anchor="middle">an upload in progress</text>
<path d="M200.8 196V1390" stroke="#a78bfa" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="3 6"/>
<rect x="306.5" y="120" width="175.5" height="72" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#5eead4" stroke-opacity="0.55"/>
<rect x="320.5" y="120" width="147.5" height="3" rx="1.5" fill="#5eead4"/>
<text x="394.2" y="151.0" font-size="16" fill="#e8f4f6" font-weight="700" text-anchor="middle">Core leader</text>
<text x="394.2" y="174.0" font-size="13" fill="#93b6c1" font-weight="400" text-anchor="middle">placement and commit</text>
<path d="M394.2 196V1390" stroke="#5eead4" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="3 6"/>
<rect x="500.0" y="120" width="175.5" height="72" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.55"/>
<rect x="514.0" y="120" width="147.5" height="3" rx="1.5" fill="#fbbf24"/>
<text x="587.8" y="151.0" font-size="16" fill="#e8f4f6" font-weight="700" text-anchor="middle">Store S</text>
<text x="587.8" y="174.0" font-size="13" fill="#93b6c1" font-weight="400" text-anchor="middle">site B, being restarted</text>
<path d="M587.8 196V1390" stroke="#fbbf24" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="3 6"/>
<rect x="693.5" y="120" width="175.5" height="72" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.55"/>
<rect x="707.5" y="120" width="147.5" height="3" rx="1.5" fill="#60a5fa"/>
<text x="781.2" y="151.0" font-size="16" fill="#e8f4f6" font-weight="700" text-anchor="middle">Stores</text>
<text x="781.2" y="174.0" font-size="13" fill="#93b6c1" font-weight="400" text-anchor="middle">sites A and C</text>
<path d="M781.2 196V1390" stroke="#60a5fa" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="3 6"/>
<path d="M24 232H876" stroke="#5eead4" stroke-opacity="0.18"/>
<text x="28.0" y="252.0" font-size="12.5" fill="#5eead4" font-weight="700" text-anchor="start" letter-spacing="1.6">THE STORE ANNOUNCES ITS STOP</text>
<rect x="477.4" y="272.0" width="220.8" height="58" rx="10" fill="#08202b" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="477.4" y="278.0" width="4" height="46" rx="2" fill="#fbbf24"/>
<text x="493.4" y="294.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">upgrade: plugin removed</text>
<text x="493.4" y="314.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">or agent stopped</text>
<text x="24.0" y="294.0" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="start">stop</text>
<rect x="461.1" y="344.0" width="253.2" height="58" rx="10" fill="#08202b" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="461.1" y="350.0" width="4" height="46" rx="2" fill="#fbbf24"/>
<text x="477.1" y="366.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">refuses new writes: signed,</text>
<text x="477.1" y="386.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">retryable, marked draining</text>
<path d="M579.8 460H404.2" stroke="#fbbf24" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#ah-sig)"/>
<text x="491.0" y="426.0" font-size="15" fill="#e8f4f6" font-weight="600" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">signed departure notice</text>
<text x="491.0" y="446.0" font-size="15" fill="#93b6c1" font-weight="400" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">to every core peer, bound to this boot</text>
<rect x="279.8" y="486.0" width="228.9" height="98" rx="10" fill="#08202b" stroke="#5eead4" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="279.8" y="492.0" width="4" height="86" rx="2" fill="#5eead4"/>
<text x="295.8" y="508.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">site B DOWN for new work</text>
<text x="295.8" y="528.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">at once, no quarantine;</text>
<text x="295.8" y="548.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">an older boot's notice</text>
<text x="295.8" y="568.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">is ignored</text>
<path d="M24 612H876" stroke="#5eead4" stroke-opacity="0.18"/>
<text x="28.0" y="632.0" font-size="12.5" fill="#5eead4" font-weight="700" text-anchor="start" letter-spacing="1.6">WRITES CARRY ON WITHOUT IT</text>
<path d="M208.8 676H384.2" stroke="#38bdf8" stroke-width="4.0" fill="none" stroke-linecap="round" marker-end="url(#ah-data)"/>
<text x="297.5" y="662.0" font-size="15" fill="#e8f4f6" font-weight="600" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">next part of the upload</text>
<path d="M402.2 746H771.2" stroke="#38bdf8" stroke-width="4.0" fill="none" stroke-linecap="round" marker-end="url(#ah-data)"/>
<text x="587.8" y="712.0" font-size="15" fill="#e8f4f6" font-weight="600" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">open writes placed again</text>
<text x="587.8" y="732.0" font-size="15" fill="#93b6c1" font-weight="400" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">on the other stores</text>
<rect x="287.9" y="772.0" width="212.6" height="78" rx="10" fill="#08202b" stroke="#4ade80" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="287.9" y="778.0" width="4" height="66" rx="2" fill="#4ade80"/>
<text x="303.9" y="794.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">commits on two sites</text>
<text x="303.9" y="814.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">(minimum copies 2 of 3</text>
<text x="303.9" y="834.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">on the test bed)</text>
<path d="M386.2 888H210.8" stroke="#4ade80" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#ah-ok)"/>
<text x="297.5" y="874.0" font-size="15" fill="#e8f4f6" font-weight="600" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">committed</text>
<path d="M24 928H876" stroke="#5eead4" stroke-opacity="0.18"/>
<text x="28.0" y="948.0" font-size="12.5" fill="#5eead4" font-weight="700" text-anchor="start" letter-spacing="1.6">THE STORE COMES BACK</text>
<rect x="501.0" y="968.0" width="173.5" height="58" rx="10" fill="#08202b" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="501.0" y="974.0" width="4" height="46" rx="2" fill="#fbbf24"/>
<text x="517.0" y="990.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">new boot of the</text>
<text x="517.0" y="1010.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">upgraded build</text>
<text x="24.0" y="990.0" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="start">start</text>
<path d="M579.8 1084H404.2" stroke="#5eead4" stroke-width="2.0" fill="none" stroke-linecap="round" marker-end="url(#ah-ctl)"/>
<text x="491.0" y="1050.0" font-size="15" fill="#e8f4f6" font-weight="600" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">registration naming</text>
<text x="491.0" y="1070.0" font-size="15" fill="#93b6c1" font-weight="400" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">the new boot</text>
<rect x="296.1" y="1110.0" width="196.4" height="58" rx="10" fill="#08202b" stroke="#5eead4" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="296.1" y="1116.0" width="4" height="46" rx="2" fill="#5eead4"/>
<text x="312.1" y="1132.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">UP again once its</text>
<text x="312.1" y="1152.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">description verifies</text>
<path d="M402.2 1226H577.8" stroke="#38bdf8" stroke-width="4.0" fill="none" stroke-linecap="round" marker-end="url(#ah-data)"/>
<text x="491.0" y="1192.0" font-size="15" fill="#e8f4f6" font-weight="600" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">repair restores</text>
<text x="491.0" y="1212.0" font-size="15" fill="#93b6c1" font-weight="400" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">the third copy</text>
<rect x="114.0" y="1252.0" width="754.0" height="118" rx="10" fill="#08202b" stroke="#93b6c1" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="114.0" y="1258.0" width="4" height="106" rx="2" fill="#93b6c1"/>
<text x="130.0" y="1274.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">A write that meets a silent store is undone and placed again by the core</text>
<text x="130.0" y="1294.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">(an older build, a crash, a lost notice). When no other store may take it, it waits</text>
<text x="130.0" y="1314.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">only for a store that failed under that very write or announced its stop: at most</text>
<text x="130.0" y="1334.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">30 s and 4 failed stores an episode, and 120 s an upload, then it fails, retryable.</text>
<text x="130.0" y="1354.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">A store that is simply down fails such a write at once.</text>
<text x="40.0" y="1412.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">Built and tested on the development branch (2026-10-28); nothing is journaled, so mixed</text>
<text x="40.0" y="1438.0" font-size="14.5" fill="#93b6c1" font-weight="400" text-anchor="start">builds are safe. After 120 s without a new boot the store is judged by its silence again.</text>
<text x="40.0" y="1464.0" font-size="14.5" fill="#93b6c1" font-weight="400" text-anchor="start">On the HPC test bed: in progress.</text>
<path d="M40 1508h44" stroke="#5eead4" stroke-width="2.0" stroke-linecap="round"/>
<text x="96.0" y="1513.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">request or control message (signed)</text>
<path d="M460 1508h44" stroke="#38bdf8" stroke-width="4.0" stroke-linecap="round"/>
<text x="516.0" y="1513.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">data on the dataplane (encrypted)</text>
<path d="M40 1536h44" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
<text x="96.0" y="1541.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">signed notice from the stopping store</text>
<path d="M460 1536h44" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>
<text x="516.0" y="1541.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">accepted</text>
<rect x="0.75" y="0.75" width="898.5" height="1580.5" rx="22" fill="none" stroke="#5eead4" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
