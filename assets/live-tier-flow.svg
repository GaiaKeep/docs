<text x="334.0" y="668.0" font-size="14" fill="#cfe3e8" font-weight="400" text-anchor="start">v7/  copy, leased</text>
<text x="334.0" y="689.0" font-size="14" fill="#cfe3e8" font-weight="400" text-anchor="start">ws/  workspace: edit, then</text>
<text x="334.0" y="710.0" font-size="14" fill="#cfe3e8" font-weight="400" text-anchor="start">      publish a new version</text>
<rect x="640.0" y="600.0" width="330.0" height="150.0" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.4"/>
<text x="662.0" y="632.0" font-size="13" fill="#38bdf8" font-weight="700" text-anchor="start" letter-spacing="1.6">LIVE NODE B · SITE COMPUTE</text>
<rect x="662" y="652" width="18" height="10" rx="2" fill="#0b2a36" stroke="#38bdf8" stroke-opacity="0.75"/>
<rect x="662" y="657" width="46" height="40" rx="4" fill="#0b2a36" stroke="#38bdf8" stroke-opacity="0.9"/>
