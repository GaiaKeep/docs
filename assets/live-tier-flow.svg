<rect x="683" y="686.0" width="14" height="6" rx="1.5" fill="#38bdf8" fill-opacity="0.75"/>
<text x="724.0" y="668.0" font-size="14" fill="#cfe3e8" font-weight="400" text-anchor="start">v7/  copy, pinned</text>
<text x="724.0" y="689.0" font-size="14" fill="#cfe3e8" font-weight="400" text-anchor="start">read in place by jobs and</text>
<text x="724.0" y="710.0" font-size="14" fill="#cfe3e8" font-weight="400" text-anchor="start">tools at local-disk speed</text>
<text x="40.0" y="640.0" font-size="15" fill="#e8f4f6" font-weight="650" text-anchor="start">Unencrypted</text>
<text x="40.0" y="664.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">native files, any</text>
<text x="40.0" y="684.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">type, by owner</text>
<text x="40.0" y="704.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">decision (2026-10-27)</text>
<text x="1000.0" y="640.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">The operating</text>
<text x="1000.0" y="660.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">system is the</text>
<text x="1000.0" y="680.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">boundary on the</text>
<text x="1000.0" y="700.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">node; reads there</text>
<text x="1000.0" y="720.0" font-size="14" fill="#93b6c1" font-weight="400" text-anchor="start">are not audited</text>
