<text x="271.4" y="334.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">traffic from this moment</text>
<text x="24.0" y="294.0" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="start">t = 0</text>
