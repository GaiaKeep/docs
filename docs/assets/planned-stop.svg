<text x="297.5" y="1064.0" font-size="15" fill="#93b6c1" font-weight="400" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">retry_after_ms</text>
<path d="M208.8 1148H577.8" stroke="#4ade80" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#ah-ok)"/>
<text x="394.2" y="1114.0" font-size="15" fill="#e8f4f6" font-weight="600" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">the same request at B: done</text>
<text x="394.2" y="1134.0" font-size="15" fill="#93b6c1" font-weight="400" text-anchor="middle" stroke="#08202b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">a cut job is resubmitted by its request_id</text>
<rect x="98.0" y="1174.0" width="578.0" height="78" rx="10" fill="#08202b" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="98.0" y="1180.0" width="4" height="66" rx="2" fill="#a78bfa"/>
<text x="114.0" y="1196.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">A write whose leadership ended under it answers outcome_unknown:</text>
<text x="114.0" y="1216.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">the next leader decides it. Clients resend only what is safe twice:</text>
<text x="114.0" y="1236.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">reads, requests keyed by request_id, livehold extend, pin, unpin.</text>
<rect x="275.8" y="1266.0" width="237.0" height="58" rx="10" fill="#08202b" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="275.8" y="1272.0" width="4" height="46" rx="2" fill="#fbbf24"/>
<text x="291.8" y="1288.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">lingers 3 s answering its</text>
<text x="291.8" y="1308.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">refusal, then lets go</text>
<text x="24.0" y="1288.0" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="start">+ 3 s</text>
<rect x="275.8" y="1338.0" width="237.0" height="78" rx="10" fill="#08202b" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="275.8" y="1344.0" width="4" height="66" rx="2" fill="#fbbf24"/>
<text x="291.8" y="1360.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">the JVM exits by itself;</text>
<text x="291.8" y="1380.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">the whole stop is bounded</text>
<text x="291.8" y="1400.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">at 25 s</text>
<text x="24.0" y="1360.0" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="start">3.3–3.9 s</text>
<text x="40.0" y="1458.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">Measured on a local fabric with a live node, 2026-10-28 (E18 LT-C3): 10 planned stops of the</text>
<text x="40.0" y="1484.0" font-size="14.5" fill="#93b6c1" font-weight="400" text-anchor="start">leader, 0 failed client calls, no halted log, no spontaneous election. Before the fix: 5 to 36</text>
<text x="40.0" y="1510.0" font-size="14.5" fill="#93b6c1" font-weight="400" text-anchor="start">failed calls per stop, and every JVM killed after 60 s. On the HPC test bed: in progress.</text>
