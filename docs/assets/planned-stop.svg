<text x="501.5" y="768.0" font-size="14.5" fill="#e8f4f6" font-weight="600" text-anchor="start">new leader, serving</text>
<text x="501.5" y="788.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">0.726–0.740 s after</text>
<text x="501.5" y="808.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">the signal (measured)</text>
<text x="24.0" y="768.0" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="start">≈ 0.73 s</text>
<path d="M24 852H876" stroke="#5eead4" stroke-opacity="0.18"/>
<text x="28.0" y="872.0" font-size="12.5" fill="#5eead4" font-weight="700" text-anchor="start" letter-spacing="1.6">CLIENTS FOLLOW; NOTHING FAILS</text>
<rect x="263.6" y="892.0" width="261.4" height="78" rx="10" fill="#08202b" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.3"/>
<rect x="263.6" y="898.0" width="4" height="66" rx="2" fill="#fbbf24"/>
