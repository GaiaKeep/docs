<text x="279.6" y="934.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">nothing, never campaigns;</text>
<text x="279.6" y="954.0" font-size="14.5" fill="#cfe3e8" font-weight="400" text-anchor="start">answers votes and appends</text>
